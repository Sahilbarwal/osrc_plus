name: osrc_plus
description: OSRC Plus Attendance Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0
  intl: ^0.19.0
  csv: ^5.0.0
  open_filex: ^4.0.4
  image_picker: ^1.2.0
  permission_handler: ^11.4.0
  path: ^1.8.0
  pdf: ^3.10.4
  printing: ^5.11.1
  path_provider: ^2.1.5
  hive: ^2.2.0
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  provider: ^6.0.5
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png  # Optional: add your logo